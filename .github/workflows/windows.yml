name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/inline-slash-links-950a
      - cursor/daily-note-no-task-tile-950a
    paths:
      - "app/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: fast-manager-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/inline-slash-links-950a' || github.ref == 'refs/heads/cursor/daily-note-no-task-tile-950a')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: F.A.S.T Manager ${{ steps.version.outputs.value }}
          make_latest: true
          overwrite_files: true
          body: |
            Instalátor nahrazuje nainstalovanou verzi (stejná aplikace com.fast.manager).
            V průvodci nech vybranou volbu odinstalovat předchozí verzi a data aplikace nemaž.
            Od 1.0.2 se při startu neotevírá terminál. Od 1.0.3 je vzhled bílý, šedý a černý.
            Od 1.0.4 denní poznámka píše jako text. Objekt založí jen zkratka: /o osoba, /u úkol, /pro projekt, /s schůzka, /poz poznámka, /? otázka.
            Od 1.0.5 denní poznámka nemá mřížku náhledů. Pod nadpisem je textové pole.
            Od 1.0.6 kalendář neukazuje počet pod dnem. Na stránce osoby jsou úkoly, které na ni patří.
            Od 1.0.7 se na úkolech filtruje podle stavu a přiřazené osoby.
            Od 1.0.8 denní poznámka neukazuje dlaždici úkolu nad textem.
            Od 1.0.9 zkratka funguje i uprostřed věty a několik zkratek na jednom řádku.
            Od 1.0.10 je denní poznámka souvislý text. Jméno po zkratce zůstane ve větě jako odkaz.
          files: app/src-tauri/target/release/bundle/nsis/*.exe
